name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# This workflow authenticates to npm with trusted publishing (OIDC), so
# npm's trusted publisher for this package must point at this exact workflow
# file. No NPM_TOKEN is needed; id-token is used to mint the OIDC token.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install --global npm@latest

      - run: pnpm install --frozen-lockfile

      # Opens (or updates) a "Version Packages" pull request while unreleased
      # changesets are pending, and publishes once that pull request is merged
      # and no changesets are left.
      - uses: changesets/action@v1
        with:
          version: pnpm run changeset:version
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
